<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="content-language" content="zh" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLS 播放器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <h1>HLS 播放室</h1>
        <p class="tagline">貼上 m3u8 網址即可播放（Chrome / Firefox 需 hls.js）</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel controls-panel" aria-label="來源設定">
      <label class="field-label" for="src-input">串流網址</label>
      <div class="input-row">
        <input
          id="src-input"
          type="url"
          name="url"
          placeholder="例如：https://…/playlist.m3u8"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="btn-load" class="btn primary">載入</button>
      </div>
      <p class="hint">
        第三方 CDN 常設 <strong>CORS</strong>，若無法播放請改由你自家的 Fastify／Nginx 做同源代理，或於本機用
        <code>python -m http.server</code> 開啟此資料夾測試（仍可能受 CORS 限制）。
      </p>
      <div class="chips" role="group" aria-label="快捷">
        <button type="button" class="chip" data-demo="clear">清除</button>
        <button type="button" class="chip" id="btn-fullscreen" title="F">全螢幕</button>
      </div>
    </section>

    <section class="panel stage" aria-label="影片">
      <div class="video-shell">
        <video id="player" playsinline controlsList="nodownload" poster=""></video>
        <div id="status" class="status" role="status"></div>
      </div>
      <div class="toolbar">
        <span id="meta-line" class="meta-line"></span>
        <kbd>空白鍵</kbd><span>播放／暫停</span>
        <span class="dot">·</span>
        <kbd>F</kbd><span>全螢幕</span>
      </div>
    </section>
  </main>

  <footer class="foot">
    <small>m3u8 來源須允許瀏覽器跨域讀取，否則需後端轉發。</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
